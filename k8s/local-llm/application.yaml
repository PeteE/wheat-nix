apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-llm
  namespace: default
spec:
  project: default
  source:
    repoURL: https://github.com/PeteE/wheat-nix.git
    targetRevision: HEAD
    path: k8s/local-llm
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: local-llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
