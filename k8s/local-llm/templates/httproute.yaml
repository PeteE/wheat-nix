apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    - {{ .Values.hostname }}
  rules:
    - timeouts:
        request: {{ .Values.timeout | default "300s" }}
        backendRequest: {{ .Values.timeout | default "300s" }}
      backendRefs:
        - name: {{ .Release.Name }}
          port: {{ .Values.port }}
