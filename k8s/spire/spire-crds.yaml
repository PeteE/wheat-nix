---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: spire-crds
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://spiffe.github.io/helm-charts-hardened/
    chart: spire-crds
    targetRevision: "0.5.0"
    helm:
      values: |
        # CRDs chart typically has minimal configuration
  destination:
    server: https://kubernetes.default.svc
    namespace: spire
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
