---
# Sample coco deployment via QEMU (works on older CPUs without XCRS)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-kata-qemu
  namespace: coco-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-kata-qemu
  template:
    metadata:
      labels:
        app: nginx-kata-qemu
    spec:
      runtimeClassName: kata-qemu
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-kata-qemu
  namespace: coco-system
spec:
  type: NodePort
  selector:
    app: nginx-kata-qemu
  ports:
  - port: 80
    targetPort: 80
