---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coco
  namespace: default
spec:
  project: default
  source:
    chart: confidential-containers
    repoURL: ghcr.io/confidential-containers/charts
    targetRevision: 0.18.0
    helm:
      releaseName: coco
      values: |
        kata-as-coco-runtime:
          debug: true
          enabled: true
          k8sDistribution: k3s
          shims:
            clh:
              enabled: true
              allowedHypervisorAnnotations:
                - enable_tpm
            qemu:
              enabled: true
              allowedHypervisorAnnotations:
                - enable_tpm

  destination:
    server: https://kubernetes.default.svc
    namespace: coco-system
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true


