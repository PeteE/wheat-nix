apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kgateway
  namespace: default
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    chart: kgateway
    repoURL: cr.kgateway.dev/kgateway-dev/charts
    targetRevision: v2.1.2
    helm:
      values: |
        controller:
          replicaCount: 1
          logLevel: info
        waypoint:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: kgateway-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
