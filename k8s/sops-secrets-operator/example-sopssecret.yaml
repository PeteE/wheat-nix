# Example SopsSecret - DO NOT commit with real values
# This file shows the structure of a SopsSecret resource
#
# To create an encrypted secret:
# 1. Create a file like this with your actual values
# 2. Encrypt it: sops --encrypt --in-place your-secret.yaml
# 3. Commit the encrypted file
#
# The operator will decrypt it and create a regular Kubernetes Secret
---
apiVersion: isindir.github.com/v1alpha3
kind: SopsSecret
metadata:
  name: example-secret
  namespace: default
spec:
  # This becomes a regular Kubernetes Secret with these properties
  secretTemplates:
    - name: my-app-secret
      labels:
        app: my-app
      stringData:
        username: my-username
        password: my-password
